name: Test BUY

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      KRAKEN_KEY: ${{ secrets.KRAKEN_KEY }}
      KRAKEN_SECRET: ${{ secrets.KRAKEN_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - run: python test_buy.py
