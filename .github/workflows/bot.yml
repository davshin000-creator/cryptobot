name: Live Multi Coin Bot

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    env:
      KRAKEN_KEY: ${{ secrets.KRAKEN_KEY }}
      KRAKEN_SECRET: ${{ secrets.KRAKEN_SECRET }}
      TOKEN: ${{ secrets.TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Packages
        run: pip install -r requirements.txt

      - name: Run Multi Coin Bot
        run: python live_multi_bot.py

      - name: Save Trade Log
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add multi_trade_log.csv || true
          git commit -m "Update multi trade log" || echo "No changes to commit"
          git push
