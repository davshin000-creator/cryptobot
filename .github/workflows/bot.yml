name: Live ETH Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    env:
      KRAKEN_KEY: ${{ secrets.KRAKEN_KEY }}
      KRAKEN_SECRET: ${{ secrets.KRAKEN_SECRET }}
      TOKEN: ${{ secrets.TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run Live ETH Bot
        run: python live_btc_bot.py

      - name: Save trade log
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if [ -f trade_log.csv ]; then
            git add trade_log.csv
            git commit -m "Update trade log" || echo "No changes to commit"
            git push
          else
            echo "No trade_log.csv found"
          fi
