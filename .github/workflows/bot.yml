name: Kraken Trading Bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          KRAKEN_API_KEY: ${{ secrets.KRAKEN_KEY }}
          KRAKEN_API_SECRET: ${{ secrets.KRAKEN_SECRET }}
        run: python main.py
